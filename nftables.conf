#!/usr/sbin/nft -f
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    ct state established,related accept
    iif lo accept

    # allow ping etc
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    # LAN -> Pi services
    iif "eth0" tcp dport { 22, 80, 443 } accept
    iif "eth0" udp dport 53 accept
    iif "eth0" tcp dport 53 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;

    # Kill IPv6 forwarding (forces Windows -> IPv4 fast)
    meta nfproto ipv6 drop

    # ICMPv4 is important for diagnostics/PMTU on IPv4 paths
    ip protocol icmp accept

    # --- MTU / MSS clamp (TCP only) ---
    tcp flags syn tcp option maxseg size set rt mtu

    ct state established,related accept

    # LAN clients can go out
    iif "eth0" accept
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table inet sbprx {
  # === SB-WEBUI:BEGIN force_udp_vpn_clients ===
  set force_udp_vpn_clients {
    type ipv4_addr
    flags interval
    # SB-WEBUI-ELEMENTS
  }
  # === SB-WEBUI:END force_udp_vpn_clients ===

  # === SB-WEBUI:BEGIN bypass_vpn_clients ===
  set bypass_vpn_clients {
    type ipv4_addr
    flags interval
    # SB-WEBUI-ELEMENTS
  }
  # === SB-WEBUI:END bypass_vpn_clients ===

  chain prerouting {
    type filter hook prerouting priority mangle; policy accept;

    udp dport 53 return
    tcp dport 53 return

    # Clients in this set skip sing-box entirely and use plain forwarding/NAT via the Pi.
    # Clear any inherited mark before returning so policy routing cannot re-catch them later.
    iif "eth0" ip saddr @bypass_vpn_clients meta mark set 0 return

    # Never TPROXY packets aimed at addresses owned by the Pi itself.
    # This stays correct even if the Pi has multiple/dynamic IPv4 addresses.
    # Fast mode (web only)
    iif "eth0" fib daddr type != local tcp dport { 80, 443 } meta mark set 1 tproxy ip to :12345
    iif "eth0" fib daddr type != local udp dport 443 meta mark set 1 tproxy ip to :12345

    # Slow gaming mode (UDP for selected clients)
    iif "eth0" ip saddr @force_udp_vpn_clients fib daddr type != local udp dport != 53 \
      meta mark set 1 tproxy ip to :12345
  }
}

table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oif { "eth0", "wlan0" } masquerade
  }
}
